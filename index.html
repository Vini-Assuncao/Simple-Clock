<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relógio</title>
  <meta name="description" content="Relógio online com fuso horário, modo prova com avisos, tela cheia e vários estilos.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="toolbar">
    <button id="fsBtn" class="icon-btn" title="Tela cheia" aria-label="Tela cheia">⛶</button>
    <button id="cfgBtn" class="icon-btn" title="Configurações" aria-label="Configurações" aria-expanded="false">⚙</button>
  </div>

  <main class="stage">
    <div id="dateLine" class="date"></div>

    <div id="digital" class="digital"><span id="digitalTime"></span></div>

    <div id="flip" hidden>
      <div id="flipRow" class="flip-row"></div>
      <div id="flipAmpm" class="flip-ampm"></div>
    </div>

    <div id="analog" class="analog" hidden></div>

    <div id="tzLabel" class="tz"></div>

    <div id="examAlert" class="exam-alert" role="status" aria-live="polite" hidden></div>

    <section id="examBox" class="exam" hidden></section>
  </main>

  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <h2>Configurações</h2>
      <button id="closeBtn" class="close-btn" aria-label="Fechar">×</button>
    </div>

    <h3>Cores</h3>
    <div class="field">
      <span>Cor do fundo</span>
      <div id="bgSwatches" class="swatches" data-key="bg"></div>
    </div>
    <div class="field">
      <span>Cor do relógio</span>
      <div id="clockSwatches" class="swatches" data-key="clockTheme"></div>
    </div>
    <div class="field">
      <span>Cor dos textos</span>
      <div id="textSwatches" class="swatches" data-key="textColor"></div>
    </div>
    <div class="field">
      <span>Cor do ponteiro</span>
      <div id="pointerSwatches" class="swatches" data-key="pointer"></div>
      <div class="row">
        <input type="color" id="pointerColor" aria-label="Cor personalizada do ponteiro">
        <span>Personalizada</span>
      </div>
    </div>

    <h3>Relógio</h3>
    <label>Tipo de relógio
      <select id="clockType">
        <option value="digital">Digital</option>
        <option value="flip">Flip</option>
        <option value="analog">Analógico</option>
      </select>
    </label>
    <label>Formato
      <select id="fmt">
        <option value="24">24 horas</option>
        <option value="12">12 horas</option>
      </select>
    </label>
    <label class="check">
      <input type="checkbox" id="showDate"> Mostrar data
    </label>

    <h3>Fuso horário</h3>
    <label class="check">
      <input type="checkbox" id="showTz"> Mostrar fuso horário
    </label>
    <label class="check">
      <input type="checkbox" id="tzAuto"> Detectar fuso automaticamente
    </label>
    <label>Fuso manual
      <select id="tzSelect"></select>
    </label>

    <h3>Modo prova</h3>
    <label class="check">
      <input type="checkbox" id="examOn"> Ativar modo prova
    </label>
    <div id="examOpts" hidden>
      <label>Início
        <input type="datetime-local" id="examStart">
      </label>
      <label>Fim
        <input type="datetime-local" id="examEnd">
      </label>
      <label class="check">
        <input type="checkbox" id="showTimes"> Mostrar início e fim abaixo do relógio
      </label>
      <label class="check">
        <input type="checkbox" id="showCountdown"> Mostrar contagem regressiva
      </label>

      <h4>Avisos antes do fim</h4>
      <label class="check"><input type="checkbox" id="alert60"> Faltam 1 hora</label>
      <label class="check"><input type="checkbox" id="alert30"> Faltam 30 minutos</label>
      <label class="check"><input type="checkbox" id="alert15"> Faltam 15 minutos</label>
      <label class="check"><input type="checkbox" id="alert10"> Faltam 10 minutos</label>
      <label class="check"><input type="checkbox" id="alert5"> Faltam 5 minutos</label>
      <label class="check"><input type="checkbox" id="alert1"> Falta 1 minuto</label>
      <p class="hint">Os avisos aparecem acima do cronômetro e somem após 1 minuto.</p>

      <p class="hint">Os horários são interpretados no fuso selecionado.</p>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
